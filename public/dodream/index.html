<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>두드림 머니노트</title>
    <meta name="theme-color" content="#087b73">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/app-icon.svg">
    <link rel="apple-touch-icon" href="/app-icon.svg">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">D</div>
          <div>
            <h1>두드림 머니노트</h1>
            <p id="todayLabel">개인 돈관리</p>
          </div>
        </div>
        <div class="header-actions" aria-label="데이터 관리">
          <div class="google-sync-box" aria-live="polite">
            <button class="text-button compact" id="googleAuthBtn" type="button">Google 연결</button>
            <span id="googleSyncStatus" class="sync-status">캘린더 연결 전</span>
          </div>
          <button class="icon-button" id="exportJsonBtn" type="button" title="백업">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v10m0 0 4-4m-4 4-4-4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
          <button class="icon-button" id="importJsonBtn" type="button" title="불러오기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21V11m0 0 4 4m-4-4-4 4M5 9V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/>
            </svg>
          </button>
          <input id="importFile" type="file" accept="application/json" hidden>
        </div>
      </header>

      <main>
        <section class="month-panel" aria-labelledby="monthTitle">
          <button class="icon-button" id="prevMonthBtn" type="button" title="이전 달">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"/>
            </svg>
          </button>
          <div>
            <h2 id="monthTitle">이번 달</h2>
            <input id="monthInput" type="month" aria-label="기준 월">
          </div>
          <button class="icon-button" id="nextMonthBtn" type="button" title="다음 달">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </button>
        </section>

        <section class="summary-grid" aria-label="월간 현황">
          <button class="metric-card metric-income" type="button" data-summary="received" aria-expanded="false">
            <span>입금</span>
            <strong id="receivedIncome">0원</strong>
          </button>
          <button class="metric-card metric-pending" type="button" data-summary="pending" aria-expanded="false">
            <span>예정</span>
            <strong id="pendingIncome">0원</strong>
          </button>
          <button class="metric-card metric-business" type="button" data-summary="business" aria-expanded="false">
            <span>사업</span>
            <strong id="businessExpense">0원</strong>
          </button>
          <button class="metric-card metric-personal" type="button" data-summary="personal" aria-expanded="false">
            <span>개인</span>
            <strong id="personalExpense">0원</strong>
          </button>
          <button class="metric-card metric-invest" type="button" data-summary="investment" aria-expanded="false">
            <span>투자</span>
            <strong id="investmentTotal">0원</strong>
          </button>
          <button class="metric-card metric-net" type="button" data-summary="net" aria-expanded="false">
            <span>잔액</span>
            <strong id="cashLeft">0원</strong>
          </button>
        </section>
        <section id="summaryDetails" class="summary-details panel" hidden aria-live="polite"></section>

        <section class="calendar-panel panel" aria-labelledby="calendarIncomeTitle">
          <div class="section-heading">
            <div>
              <h2 id="calendarIncomeTitle">캘린더 강의 수익</h2>
              <p class="section-note">토마토색 강의 일정만 월별 그룹으로 묶어 보여줍니다.</p>
            </div>
            <button class="text-button compact" id="importCalendarBtn" type="button">지금 동기화</button>
          </div>

          <div class="calendar-summary-grid" aria-label="캘린더 수익 요약">
            <article class="calendar-metric">
              <span>월 수익</span>
              <strong id="calendarMonthTotal">0원</strong>
            </article>
            <article class="calendar-metric paid">
              <span>입금 완료</span>
              <strong id="calendarPaidTotal">0원</strong>
            </article>
            <article class="calendar-metric unpaid">
              <span>미입금</span>
              <strong id="calendarUnpaidTotal">0원</strong>
            </article>
          </div>

          <div class="calendar-toolbar">
            <span id="calendarIncomeCount" class="count-pill">0개</span>
            <button class="text-button compact" id="clearCalendarMonthBtn" type="button">이번 달 비우기</button>
          </div>

          <details class="calendar-add-box">
            <summary>직접 추가</summary>
            <form id="calendarAddForm" class="calendar-add-form">
              <label class="calendar-add-title">
                <span>강의명</span>
                <input id="calendarAddTitle" type="text" placeholder="예: 성환초방과후">
              </label>
              <label>
                <span>항목</span>
                <select id="calendarAddCategory"></select>
              </label>
              <label>
                <span>횟수</span>
                <input id="calendarAddCount" type="number" min="1" step="1" inputmode="numeric" value="1">
              </label>
              <label>
                <span>수익</span>
                <input id="calendarAddAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </label>
              <label class="calendar-add-paid">
                <input id="calendarAddPaid" type="checkbox">
                <span>입금 완료</span>
              </label>
              <button class="primary-button" type="submit">추가</button>
            </form>
          </details>

          <div id="calendarIncomeList" class="calendar-list"></div>
        </section>

        <section class="entry-panel" aria-labelledby="entryTitle">
          <div class="section-heading">
            <h2 id="entryTitle">지출·투자 기록하기</h2>
            <button class="text-button compact" id="cancelEditBtn" type="button" hidden>수정 취소</button>
          </div>

          <div class="segmented-control" role="tablist" aria-label="기록 종류">
            <button class="segment active" type="button" data-type="expense">지출</button>
            <button class="segment" type="button" data-type="investment">투자</button>
          </div>

          <div class="template-row" id="templateRow" aria-label="빠른 선택"></div>

          <form id="recordForm" class="record-form">
            <input id="recordId" type="hidden">

            <div class="form-grid standard-date-row">
              <label>
                <span>사용일</span>
                <input id="recordDate" type="date">
              </label>
              <label>
                <span>구분</span>
                <select id="scope">
                  <option value="business">사업</option>
                  <option value="personal">개인</option>
                </select>
              </label>
            </div>

            <div class="form-grid">
              <label>
                <span>금액</span>
                <input id="amount" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </label>
              <label>
                <span>항목</span>
                <select id="category"></select>
              </label>
            </div>

            <label>
              <span id="titleLabel">사용 내용</span>
              <input id="title" type="text" placeholder="예: 강의 이동 교통비">
            </label>

            <label>
              <span>메모</span>
              <textarea id="memo" rows="2" placeholder="필요한 내용만 짧게"></textarea>
            </label>

            <div class="form-actions">
              <button class="primary-button" id="saveRecordBtn" type="submit">저장</button>
              <button class="text-button" id="resetFormBtn" type="button">비우기</button>
            </div>
          </form>
        </section>

        <section class="split-section">
          <article class="panel" aria-labelledby="insightTitle">
            <div class="section-heading">
              <h2 id="insightTitle">월별 분석</h2>
              <button class="text-button compact" id="exportCsvBtn" type="button">CSV</button>
            </div>
            <div class="insight-grid">
              <div>
                <h3>기관별 수입</h3>
                <div id="incomeBars" class="bar-list"></div>
              </div>
              <div>
                <h3>지출·투자 항목</h3>
                <div id="outgoingBars" class="bar-list"></div>
              </div>
            </div>
          </article>
        </section>

        <section class="panel" aria-labelledby="recordsTitle">
          <div class="section-heading records-heading">
            <h2 id="recordsTitle">기록 목록</h2>
            <div class="filter-row" aria-label="목록 필터">
              <button class="filter-chip active" type="button" data-filter="all">전체</button>
              <button class="filter-chip" type="button" data-filter="expense">지출</button>
              <button class="filter-chip" type="button" data-filter="investment">투자</button>
            </div>
          </div>
          <div id="recordsList" class="list-stack records-list"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
      window.DODREAM_GOOGLE_CLIENT_ID = "426400397280-i5lfl5hhks738ebgdgp3fnaifvnfjg02.apps.googleusercontent.com";
    </script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <script src="./app.js"></script>
  </body>
</html>
